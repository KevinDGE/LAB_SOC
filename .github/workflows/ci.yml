name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Pipeline completo
        run: python -m soc_lab all
      - name: Documentación y reportes sincronizados
        run: |
          python -m soc_lab docs
          git diff --exit-code docs/ reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas en contenedor
        run: docker compose run --rm --build tests
      - name: Arranque y healthcheck
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
