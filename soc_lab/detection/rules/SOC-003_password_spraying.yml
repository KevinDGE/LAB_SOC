id: SOC-003
name: Password spraying (muchas cuentas desde un origen)
status: stable
severity: high
description: >
  Detecta un origen que falla la autenticación contra 10 o más cuentas
  distintas en 30 minutos. El atacante prueba una o pocas contraseñas comunes
  contra muchos usuarios para evitar los bloqueos por cuenta, por lo que las
  reglas por usuario (SOC-002) no lo ven. Agnóstica de la fuente gracias al
  esquema normalizado.
mitre:
  tactics: [Credential Access]
  techniques:
    - id: T1110.003
      name: "Brute Force: Password Spraying"
      tactic: Credential Access
data_sources: [windows, sshd]
logic:
  type: distinct
  filter:
    category: authentication
    outcome: failure
  group_by: [src_ip]
  distinct_field: user
  window: 30m
  threshold: 10
summary: >
  {src_ip} falló la autenticación contra {distinct_users} cuentas distintas en {hosts}
  durante {duration_min} min.
false_positives:
  - Proxies o NAT corporativos que agregan a muchos usuarios (documentar la IP en una allowlist).
  - Sistemas de SSO mal configurados tras un cambio de política.
triage:
  - ¿Cuántas cuentas probadas existen realmente? ¿Siguen un patrón de directorio?
  - ¿Alguna cuenta tuvo un logon exitoso desde el mismo origen (SOC-004)?
  - ¿El servicio atacado está expuesto a Internet (OWA, VPN, SSO)?
response:
  - Bloquear el origen y revisar las cuentas con éxito posterior.
  - Exigir MFA en servicios expuestos y aplicar listas de contraseñas prohibidas.
references:
  - https://attack.mitre.org/techniques/T1110/003/
